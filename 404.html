    .nf { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.25rem; background: radial-gradient(ellipse at 75% 20%, rgba(27, 56, 43, 0.9), var(--primary) 70%); color: var(--on-primary); }

    <div class="nf__box">

    </div>
